name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Tokens.swift matches tokens.json
        run: |
          swift scripts/generate-tokens.swift
          git diff --exit-code Sources/SprintQACore/Theme/Tokens.swift
      - name: Core tests
        run: swift test
      - name: Build for iOS
        run: xcodebuild -scheme SprintQA -destination 'generic/platform=iOS Simulator' build
      - name: Build the demo app
        run: xcodebuild -project Example/SprintQADemo.xcodeproj -scheme SprintQADemo -destination 'generic/platform=iOS Simulator' build
